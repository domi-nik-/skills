name: Release skill

# Releases a single skill when a tag of the form `<skill-name>-v<version>` is
# pushed, e.g. `nuxt-supabase-stack-v1.0.0`. The tag is the source of truth for
# the version; SKILL.md is not modified.
#
# The job validates the skill, packages it as both `.zip` and `.skill`, and
# publishes a GitHub Release with those two assets attached.

on:
  push:
    tags:
      # Match <skill>-v<semver>. The skill segment may contain hyphens.
      - "*-v[0-9]+.[0-9]+.[0-9]+"
      - "*-v[0-9]+.[0-9]+.[0-9]+-*" # pre-release suffix, e.g. -rc.1

# Least-privilege: only what is needed to create a release.
permissions:
  contents: write

concurrency:
  # One release run per tag; never cancel a release mid-flight.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag into skill name and version
        id: parse
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # Split on the last "-v" so skill names may contain hyphens.
          # nuxt-supabase-stack-v1.0.0 -> skill=nuxt-supabase-stack version=1.0.0
          if [[ ! "$tag" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+([-.+].*)?)$ ]]; then
            echo "::error::Tag '$tag' does not match '<skill>-v<version>' (e.g. my-skill-v1.0.0)."
            exit 1
          fi
          skill="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"

          echo "skill=$skill"     >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing skill '$skill' version '$version'."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: pip install "pyyaml==6.0.2"

      # Same checks as the validate workflow (scripts/validate_skills.py):
      # folder exists, SKILL.md front matter parses, name matches the folder,
      # description is present and short enough, links resolve.
      - name: Validate skill
        id: validate
        env:
          SKILL: ${{ steps.parse.outputs.skill }}
        run: python scripts/validate_skills.py "$SKILL"

      - name: Package skill (.zip and .skill)
        id: package
        env:
          SKILL: ${{ steps.parse.outputs.skill }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          out="dist"
          mkdir -p "$out"
          base="${SKILL}-v${VERSION}"

          # The archive contains the skill directory at its root
          # (e.g. nuxt-supabase-stack/SKILL.md), which is the layout Claude/Cowork
          # expects for installation. Dev-only files (evals/, tests/) and VCS noise are excluded.
          zip -r -X "$out/${base}.zip" "$SKILL" \
            -x "${SKILL}/evals/*" \
            -x "${SKILL}/tests/*" \
            -x "*/.git/*" \
            -x "*/.DS_Store" >/dev/null

          # A .skill bundle is the same archive with a .skill extension.
          cp "$out/${base}.zip" "$out/${base}.skill"

          echo "zip=$out/${base}.zip"     >> "$GITHUB_OUTPUT"
          echo "skill_bundle=$out/${base}.skill" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SKILL: ${{ steps.parse.outputs.skill }}
          VERSION: ${{ steps.parse.outputs.version }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.package.outputs.zip }}
          BUNDLE: ${{ steps.package.outputs.skill_bundle }}
        run: |
          set -euo pipefail

          # Pull the human description from SKILL.md front matter. Parsed as YAML,
          # so folded/multi-line descriptions (`description: >-`) work too.
          description="$(python scripts/validate_skills.py --field description "$SKILL")"

          # Mark pre-releases (tags carrying a -suffix on the version) automatically.
          prerelease_flag=""
          if [[ "$VERSION" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          notes_file="$(mktemp)"
          {
            echo "## ${SKILL} v${VERSION}"
            echo
            [[ -n "$description" ]] && { echo "$description"; echo; }
            # The matching section of the skill's CHANGELOG.md, if there is one.
            if [[ -f "$SKILL/CHANGELOG.md" ]]; then
              changes="$(awk -v v="$VERSION" '
                /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found=1; next } }
                found' "$SKILL/CHANGELOG.md")"
              if [[ -n "${changes//[[:space:]]/}" ]]; then
                echo "### Changes"
                printf '%s\n\n' "$changes"
              fi
            fi
            echo "### Install"
            echo
            echo "Download \`${SKILL}-v${VERSION}.skill\` and open it in Claude/Cowork, or unzip \`${SKILL}-v${VERSION}.zip\` into your skills directory."
          } > "$notes_file"

          gh release create "$TAG" \
            "$ZIP" \
            "$BUNDLE" \
            --title "${SKILL} v${VERSION}" \
            --notes-file "$notes_file" \
            $prerelease_flag
