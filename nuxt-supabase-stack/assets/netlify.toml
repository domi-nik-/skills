[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# BetterAuth catch-all must reach the server function in production.
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/server/api/auth/:splat"
  status = 200
  force = true

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
