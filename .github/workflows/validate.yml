name: Validate skills

# Runs the same checks the release workflow relies on, but on every pull
# request and push to main, so a broken skill is caught before it is tagged.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: pip install "pyyaml==6.0.2"

      - name: Validate all skills
        run: python scripts/validate_skills.py

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The dependencies the bundled scripts need at run time (see each skill's README).
      - name: Install test dependencies
        run: pip install numpy matplotlib scipy fast-simplification

      - name: Run skill tests
        run: |
          set -euo pipefail
          for dir in */tests; do
            echo "::group::$dir"
            python -m unittest discover -s "$dir" -v
            echo "::endgroup::"
          done
