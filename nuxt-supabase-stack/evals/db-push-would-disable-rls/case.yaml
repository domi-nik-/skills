schema_version: "1.1"
name: db-push-would-disable-rls
expected_outcome: |
  Advises against db:push: drizzle-kit push treats RLS as drift and disables it on every table.
  Recommends npm run db:generate, reviewing the SQL (removing any DISABLE ROW LEVEL SECURITY /
  DROP POLICY statements) and applying it through the Supabase SQL editor or migration tooling.
